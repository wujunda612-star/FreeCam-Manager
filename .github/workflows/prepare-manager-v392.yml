name: Prepare Manager V3.9.2

on:
  push:
    branches:
      - feature/manager-v3.9.2-settings-grid
    paths:
      - .github/workflows/prepare-manager-v392.yml
      - manager/incoming/v3.9.2/apply_v392.py
      - manager/incoming/v3.9.2/test_v392_contract.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.2-settings-grid

      - name: Build final V3.9.2 source ZIP from V3.9.1 baseline
        shell: python
        run: |
          from pathlib import Path
          import shutil, subprocess, sys, zipfile

          base = Path('manager/packages/FreeCam_Manager_V3.9.1_Source.zip')
          out = Path('manager/packages/FreeCam_Manager_V3.9.2_Source.zip')
          stage = Path('_v392_stage')
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir()
          with zipfile.ZipFile(base) as zf: zf.extractall(stage)
          subprocess.run([sys.executable, 'manager/incoming/v3.9.2/apply_v392.py', str(stage / 'src-wpf')], check=True)
          if out.exists(): out.unlink()
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted((stage / 'src-wpf').rglob('*')):
                  if path.is_file(): zf.write(path, path.relative_to(stage).as_posix())
          print(f'Created {out} ({out.stat().st_size} bytes)')

      - name: V3.9.2 package contract
        run: python manager/incoming/v3.9.2/test_v392_contract.py manager/packages/FreeCam_Manager_V3.9.2_Source.zip

      - name: Verify updater source-package structure
        shell: python
        run: |
          import zipfile
          package = 'manager/packages/FreeCam_Manager_V3.9.2_Source.zip'
          required = {
              'src-wpf/Build_v3_On_Windows.ps1',
              'src-wpf/Apply_Manager_Update.ps1',
              'src-wpf/FreeCamManager.sln',
              'src-wpf/FreeCamManager/FreeCamManager.csproj',
          }
          with zipfile.ZipFile(package) as zf: names = set(zf.namelist())
          missing = sorted(required - names)
          if missing: raise SystemExit('missing required package entries: ' + ', '.join(missing))
          print('Source-package structure PASS')

      - name: Expand final ZIP for Windows validation
        shell: pwsh
        run: |
          if (Test-Path _v392_verify) { Remove-Item _v392_verify -Recurse -Force }
          Expand-Archive -Path manager/packages/FreeCam_Manager_V3.9.2_Source.zip -DestinationPath _v392_verify -Force

      - name: Run real Windows build and regression suite
        shell: pwsh
        run: |
          & .\_v392_verify\src-wpf\Build_v3_On_Windows.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require final EXE output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path _v392_verify\src-wpf -Recurse -Filter FreeCam_Manager.exe | Select-Object -First 1
          if (-not $exe) { throw 'FreeCam_Manager.exe was not produced' }
          Write-Host "EXE PASS: $($exe.FullName)"

      - name: Write candidate metadata
        shell: python
        run: |
          from pathlib import Path
          import datetime, hashlib, json
          package = Path('manager/packages/FreeCam_Manager_V3.9.2_Source.zip')
          meta = {
              'version': '3.9.2',
              'displayVersion': 'V3.9.2',
              'packageName': package.name,
              'sourceSha256': hashlib.sha256(package.read_bytes()).hexdigest(),
              'size': package.stat().st_size,
              'base': 'V3.9.1',
              'branch': 'feature/manager-v3.9.2-settings-grid',
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          target = Path('manager/incoming/v3.9.2/candidate.json')
          target.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False))

      - name: Commit validated V3.9.2 package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/packages/FreeCam_Manager_V3.9.2_Source.zip manager/incoming/v3.9.2/candidate.json
          git commit -m "build: add validated Manager V3.9.2 source package"
          git push
