name: Validate Manager V3.9.5 TDD

on:
  push:
    branches:
      - feature/manager-v3.9.5-inbox-unknown
    paths:
      - .github/workflows/validate-manager-v395-tdd.yml
      - manager/incoming/v3.9.5/test_v395_inbox_unknown.py
      - manager/incoming/v3.9.5/apply_v395.py

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V3.9.5 contract against V3.9.4 baseline (RED)
        run: python manager/incoming/v3.9.5/test_v395_inbox_unknown.py manager/packages/FreeCam_Manager_V3.9.4_Source.zip
