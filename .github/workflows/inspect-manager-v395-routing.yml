name: Inspect Manager V3.9.5 Routing

on:
  push:
    branches:
      - feature/manager-v3.9.5-unrecognized-inbox
    paths:
      - .github/workflows/inspect-manager-v395-routing.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.5-unrecognized-inbox

      - name: Inspect V3.9.4 routing source
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          pkg = Path('manager/packages/FreeCam_Manager_V3.9.4_Source.zip')
          needles = [
              '90_', 'Unknown', 'Unrecognized', 'Other', '未识别', '未知',
              'ClassificationService', 'OrganizerService', 'InboxWatcherService',
              'Classify', 'Destination', 'MoveAsync', 'Move(', 'Category', 'Archive'
          ]
          out = []
          with zipfile.ZipFile(pkg) as zf:
              names = [n for n in zf.namelist() if n.endswith('.cs')]
              for name in names:
                  text = zf.read(name).decode('utf-8-sig', errors='replace')
                  lines = text.splitlines()
                  hits = [i for i,l in enumerate(lines) if any(x.lower() in l.lower() for x in needles)]
                  if not hits:
                      continue
                  if not any(k in name for k in ['Classification','Organizer','InboxWatcher','Artifact','Manifest','LibraryRebuild']):
                      continue
                  out.append('\n===== ' + name + ' =====')
                  seen=set()
                  for i in hits:
                      for n in range(max(0,i-8), min(len(lines), i+14)):
                          if n not in seen:
                              out.append(f'{n+1:05d}: {lines[n]}')
                              seen.add(n)
                      out.append('')
          target = Path('manager/incoming/v3.9.5/routing_inspect.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(out), encoding='utf-8')

      - name: Commit inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.5/routing_inspect.txt
          git commit -m "chore: capture V3.9.4 routing source" || exit 0
          git push
