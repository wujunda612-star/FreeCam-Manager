name: Inspect Manager V3.9.5 Routing

on:
  push:
    branches:
      - feature/manager-v3.9.5-unrecognized-inbox
    paths:
      - .github/workflows/inspect-manager-v395-routing.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.5-unrecognized-inbox

      - name: Inspect V3.9.4 routing source
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          pkg = Path('manager/packages/FreeCam_Manager_V3.9.4_Source.zip')
          outdir = Path('manager/incoming/v3.9.5/inspect')
          outdir.mkdir(parents=True, exist_ok=True)
          wanted = {
              'src-wpf/FreeCamManager.Core/Services/ClassificationService.cs': 'ClassificationService.cs.txt',
              'src-wpf/FreeCamManager.Core/Services/InboxWatcherService.cs': 'InboxWatcherService.cs.txt',
              'src-wpf/FreeCamManager.Core/Services/OrganizerService.cs': 'OrganizerService.cs.txt',
              'src-wpf/FreeCamManager.Tests/Program.cs': 'TestsProgram.cs.txt',
          }
          with zipfile.ZipFile(pkg) as zf:
              for source, dest in wanted.items():
                  text = zf.read(source).decode('utf-8-sig', errors='replace')
                  if source.endswith('Program.cs'):
                      lines = text.splitlines()
                      keys = ['InboxWatcherStability', 'V32ManualRefreshImmediateScan']
                      hits = [i for i,l in enumerate(lines) if any(k in l for k in keys)]
                      selected=[]; seen=set()
                      for i in hits:
                          for n in range(max(0,i-25), min(len(lines), i+150)):
                              if n not in seen:
                                  selected.append(f'{n+1:05d}: {lines[n]}'); seen.add(n)
                      text='\n'.join(selected)
                  (outdir / dest).write_text(text, encoding='utf-8')

      - name: Commit inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.5/inspect
          git commit -m "chore: capture V3.9.4 inbox regression methods" || exit 0
          git push
