name: Inspect Manager V3.9.16 UI and library behavior
on:
  push:
    paths: ['manager/incoming/v3.9.16/inspect-trigger.json']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage UI and library source
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,pathlib
          pkg=pathlib.Path('manager/packages/FreeCam_Manager_V3.9.15_Source.zip')
          assert hashlib.sha256(pkg.read_bytes()).hexdigest()=='7dcda86c5296adae4026918883164ca3d2afd8419a65dab5adc5e58fa35ac267'
          wanted={'MainWindowViewModel.cs','HistoryViewModel.cs','CustomCategoryViewModel.cs',
            'HomeViewModel.cs','InboxWatcherService.cs','RuleDefaults.cs','App.xaml.cs',
            'StableViewModel.cs','StableVersionResolver.cs','ManifestService.cs',
            'LibraryRebuildService.cs','LibraryService.cs','OrganizerService.cs',
            'Artifact.cs','DevelopmentViewModel.cs','StableView.xaml','HistoryView.xaml',
            'FreeCamManager.csproj','Program.cs'}
          out=pathlib.Path('manager/incoming/v3.9.16/inspection');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(pkg) as z:
            for n in z.namelist():
              canonical=n.replace('\\','/')
              b=canonical.split('/')[-1]
              if b in wanted:
                if b=='Program.cs' and not ('/FreeCamManager.Tests/' in canonical): continue
                fname='FreeCamManager.Tests_Program.cs' if b=='Program.cs' else b
                (out/fname).write_bytes(z.read(n))
          print('Staged',len(list(out.iterdir())),'files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/incoming/v3.9.16/inspection
          if ! git diff --cached --quiet; then
            git commit -m 'Stage V3.9.16 UI and library audit [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
