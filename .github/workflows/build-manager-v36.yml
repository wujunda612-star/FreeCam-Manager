name: Build Manager V3.6 Candidate

on:
  push:
    paths:
      - '.github/workflows/build-manager-v36.yml'
      - '.github/scripts/build_manager_v36.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract V3.5 base
        shell: bash
        run: |
          rm -rf /tmp/v36
          mkdir -p /tmp/v36
          unzip -q manager/packages/FreeCam_Manager_V3.5_Source.zip -d /tmp/v36

      - name: Add V3.6 tests first
        shell: bash
        run: python .github/scripts/build_manager_v36.py add-tests --source-root /tmp/v36

      - name: RED - prove tests fail on untouched V3.5 production source
        shell: bash
        run: |
          cd /tmp/v36/src-wpf
          dotnet restore FreeCamManager.Tests/FreeCamManager.Tests.csproj
          dotnet build FreeCamManager.Tests/FreeCamManager.Tests.csproj -c Release --no-restore -v:minimal
          set +e
          dotnet FreeCamManager.Tests/bin/Release/net8.0/FreeCamManager.Tests.dll > /tmp/v36-red-tests.txt 2>&1
          test_rc=$?
          python validate-v36.py > /tmp/v36-red-validator.txt 2>&1
          validator_rc=$?
          set -e
          cat /tmp/v36-red-tests.txt
          cat /tmp/v36-red-validator.txt
          test "$test_rc" -ne 0
          test "$validator_rc" -ne 0
          grep -q 'FAIL V3.6 context menu separator uses MenuItem separator key' /tmp/v36-red-tests.txt
          grep -q 'FAIL V3.6 home summary icons share one presentation style' /tmp/v36-red-tests.txt
          grep -q 'PASS V3.6 single-instance startup contract' /tmp/v36-red-tests.txt
          grep -q 'menu separator must use MenuItem.SeparatorStyleKey' /tmp/v36-red-validator.txt
          grep -q 'HomeSummaryIconStyle must exist' /tmp/v36-red-validator.txt
          grep -q 'app version must be 3.6.0' /tmp/v36-red-validator.txt
          echo 'RED verified.'

      - name: Apply minimal V3.6 production changes
        shell: bash
        run: python .github/scripts/build_manager_v36.py apply-production --source-root /tmp/v36

      - name: GREEN - validators and compatibility tests
        shell: bash
        run: |
          cd /tmp/v36/src-wpf
          python validate-v34-fix7-updater.py
          python validate-v35.py
          python validate-v36.py
          dotnet build FreeCamManager.Tests/FreeCamManager.Tests.csproj -c Release -v:minimal
          dotnet FreeCamManager.Tests/bin/Release/net8.0/FreeCamManager.Tests.dll

      - name: Clean generated build folders
        shell: bash
        run: python .github/scripts/build_manager_v36.py clean --source-root /tmp/v36

      - name: Upload clean V3.6 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: manager-v36-source
          path: /tmp/v36/
          include-hidden-files: true
          retention-days: 1

  windows-build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manager-v36-source
          path: source

      - name: Real Windows WPF build and publish
        shell: powershell
        run: |
          Set-Location source\src-wpf
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build_v3_On_Windows.ps1 -OutDir BuildOutput -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content .\BuildOutput\BUILD_RESULT.txt
          if (-not (Test-Path .\BuildOutput\FreeCam_Manager.exe)) { throw 'FreeCam_Manager.exe was not produced' }
          $exe = Get-Item .\BuildOutput\FreeCam_Manager.exe
          Write-Host "WINDOWS_WPF_PUBLISH_OK size=$($exe.Length)"

  stage-candidate:
    needs: [prepare, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.6
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: manager-v36-source
          path: /tmp/v36

      - name: Generate verified V3.6 patch and publish metadata
        shell: bash
        run: python .github/scripts/build_manager_v36.py stage --source-root /tmp/v36 --repo-root .

      - name: Commit candidate patch metadata to feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/incoming/v3.6.0/v35-to-v36.patch.gz.b85 manager/publish-v36.candidate.json
          git commit -m 'build: stage Manager V3.6 candidate [skip ci]'
          git pull --rebase origin feature/manager-v3.6
          git push origin HEAD:feature/manager-v3.6
