name: Repack Manager V3.8 Source

on:
  push:
    paths:
      - '.github/workflows/repack-manager-v38.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repack-manager-v38
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Repack source archive with src-wpf root
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, shutil, tempfile, zipfile
          from pathlib import Path

          package = Path('manager/packages/FreeCam_Manager_V3.8_Source.zip')
          if not package.exists():
              raise SystemExit(f'missing package: {package}')

          required = {
              'src-wpf/Build_v3_On_Windows.ps1',
              'src-wpf/Apply_Manager_Update.ps1',
              'src-wpf/FreeCamManager.sln',
          }

          with zipfile.ZipFile(package, 'r') as zf:
              names = [n for n in zf.namelist() if n and not n.endswith('/')]
              already_compatible = required.issubset(set(names))

          if not already_compatible:
              with tempfile.TemporaryDirectory() as temp:
                  source = Path(temp) / 'source'
                  source.mkdir(parents=True)
                  with zipfile.ZipFile(package, 'r') as zf:
                      zf.extractall(source)

                  rebuilt = Path(temp) / 'rebuilt.zip'
                  with zipfile.ZipFile(rebuilt, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                      for p in sorted(x for x in source.rglob('*') if x.is_file()):
                          rel = 'src-wpf/' + p.relative_to(source).as_posix()
                          info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                          info.compress_type = zipfile.ZIP_DEFLATED
                          info.external_attr = (0o100644 & 0xFFFF) << 16
                          info.create_system = 3
                          zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
                  shutil.copy2(rebuilt, package)

          with zipfile.ZipFile(package, 'r') as zf:
              names = set(zf.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'updater-compatible archive still missing entries: {missing}')
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'corrupt zip member: {bad}')

          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          size = package.stat().st_size
          print(f'updater-compatible package sha256={actual} size={size}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PACKAGE_SHA256={actual}\n')
          PY

      - name: Refresh publish metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('manager/publish.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          cfg['sourceSha256'] = os.environ['PACKAGE_SHA256']
          cfg['archivePrefix'] = 'src-wpf'
          cfg['publishRevision'] = int(cfg.get('publishRevision', 0)) + 1
          for key in ('basePackageName','baseSubdir','patchParts','patchFile','patchEncoding','patchCompression','patchSha256','sourceTreeSha256'):
              cfg.pop(key, None)
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit compatible source package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/packages/FreeCam_Manager_V3.8_Source.zip manager/publish.json
          if git diff --cached --quiet; then
            echo 'Package already compatible.'
          else
            git commit -m 'fix: repack Manager V3.8 source for updater [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
          echo "PACKAGE_COMMIT=$(git log -n 1 --format=%H -- manager/packages/FreeCam_Manager_V3.8_Source.zip)" >> "$GITHUB_ENV"

      - name: Refresh public update manifest
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path

          repo = 'wujunda612-star/FreeCam-Manager'
          cfg = json.loads(Path('manager/publish.json').read_text(encoding='utf-8'))
          package_commit = os.environ['PACKAGE_COMMIT']
          package_path = 'manager/packages/FreeCam_Manager_V3.8_Source.zip'
          manifest = {
              'schemaVersion': 1,
              'version': cfg['version'],
              'displayVersion': cfg['displayVersion'],
              'sourceRef': package_commit,
              'sourceArchiveUrl': f'https://raw.githubusercontent.com/{repo}/{package_commit}/{package_path}',
              'sourceSha256': os.environ['PACKAGE_SHA256'],
              'publishedAt': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
              'notes': cfg.get('notes',''),
          }
          Path('manager/update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit public update manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/update.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'fix: publish updater-compatible Manager V3.8 manifest [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
