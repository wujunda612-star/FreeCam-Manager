name: Inspect V3.5 Source

on:
  push:
    paths:
      - '.github/workflows/inspect-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V3.5 source
        shell: bash
        run: |
          rm -rf /tmp/v35
          mkdir -p /tmp/v35
          unzip -q manager/packages/FreeCam_Manager_V3.5_Source.zip -d /tmp/v35
      - name: Inspect build scripts
        shell: bash
        run: |
          echo '=== build files ==='
          find /tmp/v35/src-wpf -maxdepth 1 -type f | sort
          echo '=== Start_Build_v3.cmd ==='
          cat /tmp/v35/src-wpf/Start_Build_v3.cmd || true
          echo '=== Build_v3_On_Windows.ps1 ==='
          cat /tmp/v35/src-wpf/Build_v3_On_Windows.ps1 || true
      - name: Inspect regression test harness
        shell: bash
        run: |
          echo '=== Program registrations ==='
          sed -n '1,120p' /tmp/v35/src-wpf/FreeCamManager.Tests/Program.cs
          echo '=== V3.5 test methods ==='
          grep -n -A 90 -B 12 -E 'V35SettingsAndContextMenuContract|V35UpdateCleanup|V3.5 settings and context menu contract|V3.5 update cleanup' /tmp/v35/src-wpf/FreeCamManager.Tests/Program.cs || true
          echo '=== Program tail ==='
          tail -120 /tmp/v35/src-wpf/FreeCamManager.Tests/Program.cs
