name: Inspect V3.5 Source

on:
  push:
    paths:
      - '.github/workflows/inspect-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V3.5 source
        shell: bash
        run: |
          rm -rf /tmp/v35
          mkdir -p /tmp/v35
          unzip -q manager/packages/FreeCam_Manager_V3.5_Source.zip -d /tmp/v35
      - name: Inspect context menu styles and separator usages
        shell: bash
        run: |
          echo '=== Controls.xaml menu section ==='
          sed -n '385,442p' /tmp/v35/src-wpf/FreeCamManager/Styles/Controls.xaml
          echo '=== All Separator usages ==='
          grep -RIn -C 8 '<Separator' /tmp/v35/src-wpf/FreeCamManager || true
      - name: Inspect settings directory icons
        shell: bash
        run: |
          sed -n '35,90p' /tmp/v35/src-wpf/FreeCamManager/Views/SettingsView.xaml
      - name: Inspect single instance implementation
        shell: bash
        run: |
          echo '=== SingleInstanceService.cs ==='
          cat /tmp/v35/src-wpf/FreeCamManager/Services/SingleInstanceService.cs
          echo '=== App startup single-instance calls ==='
          grep -n -C 8 -E 'SingleInstance|BringPrimaryWindowToFront|OnStartup|OnExit' /tmp/v35/src-wpf/FreeCamManager/App.xaml.cs || true
      - name: Inspect version and validators
        shell: bash
        run: |
          grep -RIn -C 3 -E '<Version>|AssemblyVersion|FileVersion' /tmp/v35/src-wpf/*.props /tmp/v35/src-wpf/*/*.csproj 2>/dev/null || true
          echo '=== validate-v35.py ==='
          cat /tmp/v35/src-wpf/validate-v35.py
