name: Publish Manager Update

on:
  push:
    paths:
      - 'manager/publish.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Rebuild and validate source package
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path

          cfg = json.loads(Path('manager/publish.json').read_text(encoding='utf-8'))
          package = Path('manager/packages') / cfg['packageName']
          expected = cfg['sourceSha256'].lower()
          parts = [Path(p) for p in cfg.get('sourceParts', [])]

          if not package.exists() or hashlib.sha256(package.read_bytes()).hexdigest() != expected:
              if not parts:
                  raise SystemExit(f'package missing or invalid and no sourceParts supplied: {package}')
              missing = [str(p) for p in parts if not p.exists()]
              if missing:
                  raise SystemExit(f'missing source parts: {missing}')
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
              encoding = cfg.get('sourceEncoding', 'base64').lower()
              try:
                  if encoding == 'base85':
                      data = base64.b85decode(encoded.encode('ascii'))
                  elif encoding == 'base64':
                      data = base64.b64decode(encoded, validate=True)
                  else:
                      raise ValueError(f'unsupported sourceEncoding: {encoding}')
              except Exception as exc:
                  raise SystemExit(f'source reconstruction failed: {exc}')
              package.parent.mkdir(parents=True, exist_ok=True)
              package.write_bytes(data)

          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch: expected={expected} actual={actual}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PACKAGE_PATH={package.as_posix()}\n')
          print(f'validated {package} sha256={actual} size={package.stat().st_size}')
          PY

      - name: Commit reconstructed package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKAGE_PATH"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          cfg = json.loads(Path('manager/publish.json').read_text(encoding='utf-8'))
          for part in cfg.get('sourceParts', []):
              p = Path(part)
              if p.exists():
                  subprocess.run(['git', 'rm', '-f', '--', str(p)], check=True)
          PY
          if git diff --cached --quiet; then
            echo 'Source package already committed.'
          else
            git commit -m "Publish ${PACKAGE_PATH##*/} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Generate update manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          repo = 'wujunda612-star/FreeCam-Manager'
          cfg = json.loads(Path('manager/publish.json').read_text(encoding='utf-8'))
          package = Path('manager/packages') / cfg['packageName']
          expected = cfg['sourceSha256'].lower()
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch after commit: expected={expected} actual={actual}')

          package_commit = subprocess.check_output(
              ['git', 'log', '-n', '1', '--format=%H', '--', str(package)],
              text=True
          ).strip()
          if len(package_commit) != 40:
              raise SystemExit('could not resolve package commit')

          manifest = {
              'schemaVersion': 1,
              'version': cfg['version'],
              'displayVersion': cfg['displayVersion'],
              'sourceRef': package_commit,
              'sourceArchiveUrl': f'https://raw.githubusercontent.com/{repo}/{package_commit}/{package.as_posix()}',
              'sourceSha256': expected,
              'publishedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat().replace('+00:00','Z'),
              'notes': cfg.get('notes','')
          }
          Path('manager/update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit update manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/update.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'Publish Manager update manifest [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
