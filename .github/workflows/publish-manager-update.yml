name: Publish Manager Update

on:
  push:
    paths:
      - 'manager/publish.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Rebuild and validate source package
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, shutil, subprocess, tempfile, zipfile
          from pathlib import Path

          cfg = json.loads(Path('manager/publish.json').read_text(encoding='utf-8'))
          package = Path('manager/packages') / cfg['packageName']
          expected_zip = cfg['sourceSha256'].lower()

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def tree_hash(root):
              h = hashlib.sha256()
              files = sorted(p for p in Path(root).rglob('*') if p.is_file())
              for p in files:
                  rel = p.relative_to(root).as_posix().encode('utf-8')
                  h.update(rel)
                  h.update(b'\0')
                  h.update(hashlib.sha256(p.read_bytes()).digest())
              return h.hexdigest()

          def write_deterministic_zip(root, output):
              output.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(x for x in Path(root).rglob('*') if x.is_file()):
                      rel = p.relative_to(root).as_posix()
                      info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = (0o100644 & 0xFFFF) << 16
                      info.create_system = 3
                      zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          current_ok = package.exists() and sha256_bytes(package.read_bytes()) == expected_zip
          if not current_ok:
              base_name = cfg.get('basePackageName')
              patch_name = cfg.get('patchFile')
              patch_parts = cfg.get('patchParts') or []
              if not base_name or (not patch_name and not patch_parts):
                  raise SystemExit(f'package missing/invalid and patch reconstruction is not configured: {package}')

              base_package = Path('manager/packages') / base_name
              if not base_package.exists():
                  raise SystemExit(f'missing base package: {base_package}')

              if patch_parts:
                  part_paths = [Path(name) for name in patch_parts]
                  missing_parts = [str(path) for path in part_paths if not path.exists()]
                  if missing_parts:
                      raise SystemExit(f'missing patch parts: {missing_parts}')
                  encoded = ''.join(path.read_text(encoding='ascii').strip() for path in part_paths)
              else:
                  patch_file = Path(patch_name)
                  if not patch_file.exists():
                      raise SystemExit(f'missing patch file: {patch_file}')
                  encoded = patch_file.read_text(encoding='ascii').strip()

              encoding = cfg.get('patchEncoding', 'base85').lower()
              if encoding == 'base85':
                  compressed = base64.b85decode(encoded.encode('ascii'))
              elif encoding == 'base64':
                  compressed = base64.b64decode(encoded, validate=True)
              else:
                  raise SystemExit(f'unsupported patchEncoding: {encoding}')

              compression = cfg.get('patchCompression', 'gzip').lower()
              if compression == 'gzip':
                  patch_bytes = gzip.decompress(compressed)
              elif compression == 'none':
                  patch_bytes = compressed
              else:
                  raise SystemExit(f'unsupported patchCompression: {compression}')

              expected_patch = cfg.get('patchSha256', '').lower()
              actual_patch = sha256_bytes(patch_bytes)
              if expected_patch and actual_patch != expected_patch:
                  raise SystemExit(f'patch SHA256 mismatch: expected={expected_patch} actual={actual_patch}')

              with tempfile.TemporaryDirectory() as temp:
                  work = Path(temp) / 'source'
                  work.mkdir(parents=True)
                  with zipfile.ZipFile(base_package, 'r') as zf:
                      zf.extractall(work)

                  base_subdir = str(cfg.get('baseSubdir', '') or '').strip().strip('/\\')
                  source_root = work / base_subdir if base_subdir else work
                  if not source_root.is_dir():
                      raise SystemExit(f'configured baseSubdir does not exist after extraction: {source_root}')

                  patch_path = Path(temp) / 'update.patch'
                  patch_path.write_bytes(patch_bytes)
                  subprocess.run(
                      ['git', 'apply', '-p0', '--unsafe-paths', str(patch_path)],
                      cwd=source_root,
                      check=True,
                  )

                  expected_tree = cfg.get('sourceTreeSha256', '').lower()
                  actual_tree = tree_hash(source_root)
                  if expected_tree and actual_tree != expected_tree:
                      raise SystemExit(f'source tree SHA256 mismatch: expected={expected_tree} actual={actual_tree}')

                  write_deterministic_zip(source_root, package)

          actual_zip = sha256_bytes(package.read_bytes())
          if actual_zip != expected_zip:
              raise SystemExit(f'package SHA256 mismatch: expected={expected_zip} actual={actual_zip}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PACKAGE_PATH={package.as_posix()}\n')
              patch_parts = cfg.get('patchParts') or []
              patch_name = cfg.get('patchFile', '')
              patch_paths = patch_parts if patch_parts else ([patch_name] if patch_name else [])
              env.write(f"PATCH_PATHS={':'.join(patch_paths)}\n")
          print(f'validated {package} sha256={actual_zip} size={package.stat().st_size}')
          PY

      - name: Commit reconstructed package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKAGE_PATH"
          IFS=':' read -ra patch_paths <<< "${PATCH_PATHS:-}"
          for patch_path in "${patch_paths[@]}"; do
            if [ -n "$patch_path" ] && [ -f "$patch_path" ]; then
              git rm -f -- "$patch_path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'Source package already committed.'
          else
            git commit -m "Publish ${PACKAGE_PATH##*/} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Generate update manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          repo = 'wujunda612-star/FreeCam-Manager'
          cfg = json.loads(Path('manager/publish.json').read_text(encoding='utf-8'))
          package = Path('manager/packages') / cfg['packageName']
          expected = cfg['sourceSha256'].lower()
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch after commit: expected={expected} actual={actual}')

          package_commit = subprocess.check_output(
              ['git', 'log', '-n', '1', '--format=%H', '--', str(package)],
              text=True
          ).strip()
          if len(package_commit) != 40:
              raise SystemExit('could not resolve package commit')

          manifest = {
              'schemaVersion': 1,
              'version': cfg['version'],
              'displayVersion': cfg['displayVersion'],
              'sourceRef': package_commit,
              'sourceArchiveUrl': f'https://raw.githubusercontent.com/{repo}/{package_commit}/{package.as_posix()}',
              'sourceSha256': expected,
              'publishedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat().replace('+00:00','Z'),
              'notes': cfg.get('notes','')
          }
          Path('manager/update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit update manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/update.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'Publish Manager update manifest [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
