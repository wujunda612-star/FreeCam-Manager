name: Validate Manager V3.8 Fix1

on:
  push:
    branches:
      - fix/manager-v3.8-fix1-update-build

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare V3.8 Fix1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $PWD 'v381-source'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          Expand-Archive -LiteralPath 'manager/packages/FreeCam_Manager_V3.8_Source.zip' -DestinationPath $work -Force
          $src = Join-Path $work 'src-wpf'
          if (-not (Test-Path (Join-Path $src 'Build_v3_On_Windows.ps1'))) { throw 'src-wpf build entrypoint missing' }
          Copy-Item -Force -LiteralPath (Join-Path $src 'FreeCamManager.RC1.Tests\Program.cs') -Destination (Join-Path $src 'FreeCamManager.Tests\Program.cs')
          $testFile = Join-Path $src 'FreeCamManager.Tests\Program.cs'
          $testText = [System.IO.File]::ReadAllText($testFile)
          $testText = $testText.Replace('V3.8 RC2 path rebase merges duplicate target safely','V3.8 path rebase merges duplicate target safely')
          [System.IO.File]::WriteAllText($testFile,$testText,[System.Text.UTF8Encoding]::new($false))
          $proj = Join-Path $src 'FreeCamManager\FreeCamManager.csproj'
          $projText = [System.IO.File]::ReadAllText($proj)
          if ($projText -notmatch '<Version>3\.8\.0</Version>') { throw 'unexpected V3.8 project version before Fix1 transform' }
          $projText = $projText.Replace('<Version>3.8.0</Version>','<Version>3.8.1</Version>')
          [System.IO.File]::WriteAllText($proj,$projText,[System.Text.UTF8Encoding]::new($false))
      - name: Build through real updater entrypoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\v381-source\src-wpf\Build_v3_On_Windows.ps1' -NoLaunch -OutDir 'BuildOutput_CI'
          if ($LASTEXITCODE -ne 0) { throw "Build_v3_On_Windows.ps1 failed: $LASTEXITCODE" }
          $result = Get-Content -Raw -LiteralPath '.\v381-source\src-wpf\BuildOutput_CI\BUILD_RESULT.txt'
          if ($result -notmatch 'Tests:\s*59 passed,\s*0 failed') { throw 'Expected 59/59 core regression result not found.' }
          if (-not (Test-Path '.\v381-source\src-wpf\BuildOutput_CI\FreeCam_Manager.exe')) { throw 'Expected FreeCam_Manager.exe not produced.' }
          Write-Host 'V3.8 Fix1 updater build validation PASS.'
