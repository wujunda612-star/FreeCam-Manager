name: Inspect Manager V3.9.1 Layout

on:
  push:
    branches:
      - feature/manager-v3.9.1-ui-row
    paths:
      - .github/workflows/inspect-manager-v391.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.1-ui-row
      - name: Capture SettingsView layout from V3.9 source package
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          zpath = Path('manager/packages/FreeCam_Manager_V3.9_Source.zip')
          with zipfile.ZipFile(zpath) as z:
              name = 'src-wpf/FreeCamManager/Views/SettingsView.xaml'
              text = z.read(name).decode('utf-8-sig')
          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if '显示与行为' in line or 'SettingsRowThemeDiscard' in line or 'SettingsRowTerms' in line]
          if not hits:
              raise SystemExit('target settings layout markers not found')
          start = max(0, min(hits) - 20)
          end = min(len(lines), max(hits) + 120)
          out = '\n'.join(f'{i+1:04d}: {lines[i]}' for i in range(start, end)) + '\n'
          target = Path('manager/incoming/v3.9.1/SettingsView_current_snippet.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(out, encoding='utf-8')
      - name: Commit inspection snippet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.1/SettingsView_current_snippet.txt
          git commit -m "chore: capture V3.9 SettingsView layout" || exit 0
          git push
