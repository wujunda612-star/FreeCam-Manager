name: Inspect Manager V3.9.1 Layout

on:
  push:
    branches:
      - feature/manager-v3.9.1-ui-row
    paths:
      - .github/workflows/inspect-manager-v391.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.1-ui-row
      - name: Capture old V3.9 UI contract from source package
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          zpath = Path('manager/packages/FreeCam_Manager_V3.9_Source.zip')
          with zipfile.ZipFile(zpath) as z:
              name = 'src-wpf/FreeCamManager.Tests/Program.cs'
              text = z.read(name).decode('utf-8-sig')
          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if 'display-and-behavior settings must be organized as two explicit vertical columns' in line]
          if len(hits) != 1:
              raise SystemExit(f'expected one old contract assertion, found {len(hits)}')
          i = hits[0]
          start = max(0, i - 12)
          end = min(len(lines), i + 13)
          out = '\n'.join(f'{n+1:04d}: {lines[n]}' for n in range(start, end)) + '\n'
          target = Path('manager/incoming/v3.9.1/V39_ui_contract_snippet.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(out, encoding='utf-8')
      - name: Commit inspection snippet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.1/V39_ui_contract_snippet.txt
          git commit -m "chore: capture old V3.9 UI contract" || exit 0
          git push
