name: Extract Manager V3.9.5 Routing Sources

on:
  push:
    branches:
      - feature/manager-v3.9.5-inbox-unknown
    paths:
      - .github/workflows/extract-manager-v395-routing.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.5-inbox-unknown
      - name: Extract routing sources
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          pkg=Path('manager/packages/FreeCam_Manager_V3.9.4_Source.zip')
          target=Path('manager/incoming/v3.9.5/extracted')
          target.mkdir(parents=True, exist_ok=True)
          wanted=['ClassificationService.cs','InboxWatcherService.cs','OrganizerService.cs']
          with zipfile.ZipFile(pkg) as zf:
              for name in zf.namelist():
                  if any(name.endswith(w) for w in wanted):
                      out=target / Path(name).name
                      out.write_bytes(zf.read(name))
                      print(name, '->', out)
      - name: Commit extracted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.5/extracted
          git commit -m "chore: extract V3.9.4 routing sources" || exit 0
          git push
