name: Prepare Manager V3.9 Package

on:
  push:
    branches:
      - feature/manager-v3.9-ui-classification
    paths:
      - '.github/workflows/prepare-manager-v39.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build final V3.9 source from official V3.8 Fix1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $PWD 'v39-source'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          Expand-Archive -LiteralPath 'manager/packages/FreeCam_Manager_V3.8_Fix1_Source.zip' -DestinationPath $work -Force
          $src = Join-Path $work 'src-wpf'
          python 'manager/incoming/v3.9/inject_v39_tests.py' $src
          python 'manager/incoming/v3.9/apply_v39.py' $src

          $manifestPath = Join-Path $src 'BUILD_MANIFEST.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $manifest.Branch = 'main'
          $manifest | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $manifestPath -Encoding utf8

          & (Join-Path $src 'Build_v3_On_Windows.ps1') -NoLaunch -OutDir 'BuildOutput_CI'
          if ($LASTEXITCODE -ne 0) { throw "Build_v3_On_Windows.ps1 failed: $LASTEXITCODE" }
          $result = Get-Content -Raw -LiteralPath (Join-Path $src 'BuildOutput_CI\BUILD_RESULT.txt')
          if ($result -notmatch 'Tests:\s*62 passed,\s*0 failed') { throw 'Expected 62/62 core regression result not found.' }
          if (-not (Test-Path (Join-Path $src 'BuildOutput_CI\FreeCam_Manager.exe'))) { throw 'Expected FreeCam_Manager.exe not produced.' }

          dotnet run --project (Join-Path $src 'FreeCamManager.SQLiteMigration.Tests\FreeCamManager.SQLiteMigration.Tests.csproj') -c Release
          if ($LASTEXITCODE -ne 0) { throw "SQLite migration tests failed: $LASTEXITCODE" }

          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $verification = @($manifest.Verification)
          foreach ($entry in @('V3.9: core regression 62/62 + Windows WPF publish PASS','V3.9: SQLite migration regression PASS')) {
            if ($verification -notcontains $entry) { $verification += $entry }
          }
          $manifest.Verification = $verification
          $manifest | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $manifestPath -Encoding utf8

      - name: Create deterministic final source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, shutil, zipfile
          from pathlib import Path

          repo = Path.cwd()
          src = repo / 'v39-source' / 'src-wpf'
          for d in list(src.rglob('bin')) + list(src.rglob('obj')):
              if d.is_dir(): shutil.rmtree(d, ignore_errors=True)
          for name in ['.tools', 'BuildOutput_CI']:
              d = src / name
              if d.exists(): shutil.rmtree(d, ignore_errors=True)

          package = repo / 'manager' / 'packages' / 'FreeCam_Manager_V3.9_Source.zip'
          if package.exists(): package.unlink()
          with zipfile.ZipFile(package, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted((x for x in src.rglob('*') if x.is_file()), key=lambda x: x.relative_to(src).as_posix()):
                  rel = 'src-wpf/' + p.relative_to(src).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  info.create_system = 3
                  zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          with zipfile.ZipFile(package) as zf:
              bad = zf.testzip()
              if bad: raise SystemExit(f'zip integrity failed: {bad}')
              required = {
                  'src-wpf/Build_v3_On_Windows.ps1',
                  'src-wpf/Apply_Manager_Update.ps1',
                  'src-wpf/FreeCamManager.sln',
                  'src-wpf/FreeCamManager.Tests/Program.cs'
              }
              missing = sorted(required - set(zf.namelist()))
              if missing: raise SystemExit(f'updater-required source paths missing: {missing}')
          sha = hashlib.sha256(package.read_bytes()).hexdigest()
          print(f'V3.9 package size={package.stat().st_size} sha256={sha}')
          '@ | python -

      - name: Commit candidate package to feature branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/packages/FreeCam_Manager_V3.9_Source.zip
          if (git diff --cached --quiet) {
            Write-Host 'V3.9 source package already current.'
          } else {
            git commit -m 'build: stage Manager V3.9 source package'
            git pull --rebase origin feature/manager-v3.9-ui-classification
            git push origin HEAD:feature/manager-v3.9-ui-classification
          }
