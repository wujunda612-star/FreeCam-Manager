name: Publish Manager V3.8 Fix1 Package

on:
  push:
    paths:
      - '.github/workflows/publish-manager-v381-fix.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Prepare and validate V3.8 Fix1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $PWD 'v381-source'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          Expand-Archive -LiteralPath 'manager/packages/FreeCam_Manager_V3.8_Source.zip' -DestinationPath $work -Force
          $src = Join-Path $work 'src-wpf'
          if (-not (Test-Path (Join-Path $src 'Build_v3_On_Windows.ps1'))) { throw 'src-wpf build entrypoint missing' }

          Copy-Item -Force -LiteralPath (Join-Path $src 'FreeCamManager.RC1.Tests\Program.cs') -Destination (Join-Path $src 'FreeCamManager.Tests\Program.cs')
          $testFile = Join-Path $src 'FreeCamManager.Tests\Program.cs'
          $testText = [System.IO.File]::ReadAllText($testFile)
          $testText = $testText.Replace('V3.8 RC2 path rebase merges duplicate target safely','V3.8 path rebase merges duplicate target safely')
          [System.IO.File]::WriteAllText($testFile,$testText,[System.Text.UTF8Encoding]::new($false))

          $proj = Join-Path $src 'FreeCamManager\FreeCamManager.csproj'
          $projText = [System.IO.File]::ReadAllText($proj)
          if ($projText -notmatch '<Version>3\.8\.0</Version>') { throw 'unexpected V3.8 project version before Fix1 transform' }
          $projText = $projText.Replace('<Version>3.8.0</Version>','<Version>3.8.1</Version>')
          [System.IO.File]::WriteAllText($proj,$projText,[System.Text.UTF8Encoding]::new($false))

          & (Join-Path $src 'Build_v3_On_Windows.ps1') -NoLaunch -OutDir 'BuildOutput_CI'
          if ($LASTEXITCODE -ne 0) { throw "Build_v3_On_Windows.ps1 failed: $LASTEXITCODE" }
          $result = Get-Content -Raw -LiteralPath (Join-Path $src 'BuildOutput_CI\BUILD_RESULT.txt')
          if ($result -notmatch 'Tests:\s*59 passed,\s*0 failed') { throw 'Expected 59/59 core regression result not found.' }
          if (-not (Test-Path (Join-Path $src 'BuildOutput_CI\FreeCam_Manager.exe'))) { throw 'Expected FreeCam_Manager.exe not produced.' }
      - name: Build deterministic source package and publish metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, shutil, zipfile
          from pathlib import Path

          repo = Path.cwd()
          src = repo / 'v381-source' / 'src-wpf'

          manifest_path = src / 'BUILD_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          manifest['Version'] = 'V3.8 Fix1'
          manifest['BuildName'] = 'FreeCam_Manager_V3.8_Fix1'
          manifest['Stage'] = 'Release Fix1'
          manifest['BuildId'] = 'MANAGER-V38-FIX1-STABLE-20260914'
          modules = manifest.setdefault('Modules', [])
          item = 'formal updater build regression contract synced from RC2.1'
          if item not in modules: modules.append(item)
          verification = manifest.setdefault('Verification', [])
          item = 'V3.8 Fix1: formal updater build 59/59 + WPF publish PASS'
          if item not in verification: verification.append(item)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = src / 'V38_README.txt'
          text = readme.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          if lines:
              lines[0] = 'FreeCam Manager V3.8 Fix1'
          readme.write_text('\n'.join(lines) + '\n', encoding='utf-8-sig')

          for d in list(src.rglob('bin')) + list(src.rglob('obj')):
              if d.is_dir(): shutil.rmtree(d, ignore_errors=True)
          for name in ['.tools', 'BuildOutput_CI']:
              d = src / name
              if d.exists(): shutil.rmtree(d, ignore_errors=True)

          package = repo / 'manager' / 'packages' / 'FreeCam_Manager_V3.8_Fix1_Source.zip'
          if package.exists(): package.unlink()
          with zipfile.ZipFile(package, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted((x for x in src.rglob('*') if x.is_file()), key=lambda x: x.relative_to(src).as_posix()):
                  rel = 'src-wpf/' + p.relative_to(src).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  info.create_system = 3
                  zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          with zipfile.ZipFile(package) as zf:
              bad = zf.testzip()
              if bad: raise SystemExit(f'zip integrity failed: {bad}')
              required = {'src-wpf/Build_v3_On_Windows.ps1','src-wpf/Apply_Manager_Update.ps1','src-wpf/FreeCamManager.sln'}
              names = set(zf.namelist())
              missing = sorted(required - names)
              if missing: raise SystemExit(f'updater-required source paths missing: {missing}')

          sha = hashlib.sha256(package.read_bytes()).hexdigest()
          notes = ('V3.8 Fix1 修复 V3.7 Fix1 -> V3.8 自动更新构建失败：正式源码包的 FreeCamManager.Tests '
                   '此前仍使用 V3.7 JSON 启动恢复契约，导致 SQLite 架构在 updater 本地构建时第 58 项测试误判失败。'
                   'Fix1 将正式测试契约同步到已验证的 RC2.1 版本，并纳入路径重定位重复目标合并回归；SQLite 生产逻辑不变。')
          publish = {
              'schemaVersion': 1,
              'version': '3.8.1',
              'displayVersion': 'V3.8 Fix1',
              'packageName': package.name,
              'sourceSha256': sha,
              'notes': notes,
              'publishRevision': 1
          }
          (repo / 'manager' / 'publish.json').write_text(json.dumps(publish, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'package={package} size={package.stat().st_size} sha256={sha}')
          '@ | python -
      - name: Commit V3.8 Fix1 package and trigger normal publisher
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/packages/FreeCam_Manager_V3.8_Fix1_Source.zip manager/publish.json
          git commit -m 'release: stage Manager V3.8 Fix1 [skip ci]'
          git pull --rebase origin main
          git push origin main
