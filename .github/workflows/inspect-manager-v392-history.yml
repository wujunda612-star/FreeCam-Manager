name: Inspect Manager V3.9.2 History

on:
  push:
    branches:
      - feature/manager-v3.9.2-settings-grid
    paths:
      - .github/workflows/inspect-manager-v392-history.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.2-settings-grid

      - name: Capture full history-related source files from V3.9.1
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          package = Path('manager/packages/FreeCam_Manager_V3.9.1_Source.zip')
          targets = {
              'src-wpf/FreeCamManager/ViewModels/ArtifactRowViewModel.cs': 'artifact_row_vm.txt',
              'src-wpf/FreeCamManager/ViewModels/HistoryViewModel.cs': 'history_vm.txt',
              'src-wpf/FreeCamManager/Views/HistoryView.xaml': 'history_view_xaml.txt',
              'src-wpf/FreeCamManager.Tests/Program.cs': 'tests_program_history_excerpt.txt',
          }
          outdir = Path('manager/incoming/v3.9.2')
          outdir.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(package) as zf:
              for src, dst in targets.items():
                  text = zf.read(src).decode('utf-8-sig')
                  if src.endswith('Program.cs'):
                      lines = text.splitlines()
                      keep = []
                      for i, line in enumerate(lines):
                          if any(k in line for k in ['Duplicate', 'duplicate', 'DeleteAsync', 'protected archive', 'HistoryView', 'ArtifactRowViewModel']):
                              a, b = max(0, i-20), min(len(lines), i+35)
                              keep.extend(f'{n+1:05d}: {lines[n]}' for n in range(a,b))
                              keep.append('')
                      text = '\n'.join(keep)
                  (outdir / dst).write_text(text, encoding='utf-8')

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.2/artifact_row_vm.txt manager/incoming/v3.9.2/history_vm.txt manager/incoming/v3.9.2/history_view_xaml.txt manager/incoming/v3.9.2/tests_program_history_excerpt.txt
          git commit -m "chore: capture V3.9.1 history source files" || exit 0
          git push
