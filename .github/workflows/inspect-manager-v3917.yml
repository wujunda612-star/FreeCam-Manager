name: Inspect Manager V3.9.17 UI performance
on:
  push:
    paths: ['manager/incoming/v3.9.17/inspect-trigger.json']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage WPF UI performance sources
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,pathlib
          pkg=pathlib.Path('manager/packages/FreeCam_Manager_V3.9.16_Source.zip')
          assert hashlib.sha256(pkg.read_bytes()).hexdigest()=='76f97559df585ec21820f8977517f1f24325b2e70b89f07d39329106d375fb8b'
          wanted={'MainWindowViewModel.cs','HistoryViewModel.cs','CustomCategoryViewModel.cs',
            'HomeViewModel.cs','InboxWatcherService.cs','App.xaml.cs','StableViewModel.cs',
            'DevelopmentViewModel.cs','ArtifactRowViewModel.cs','LibraryService.cs',
            'LibraryRebuildService.cs','OrganizerService.cs','TestStatusRefreshService.cs',
            'FreeCamManager.csproj','Program.cs','HistoryView.xaml','DevelopmentView.xaml','AppPaths.cs'}
          out=pathlib.Path('manager/incoming/v3.9.17/inspection');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(pkg) as z:
            for n in z.namelist():
              canonical=n.replace('\\','/')
              b=canonical.split('/')[-1]
              if b in wanted or 'sqlite' in b.lower() or 'librarypersist' in b.lower():
                if b=='Program.cs' and '/FreeCamManager.Tests/' not in canonical: continue
                fname='FreeCamManager.Tests_Program.cs' if b=='Program.cs' else b
                (out/fname).write_bytes(z.read(n))
          print('Staged',len(list(out.iterdir())),'files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/incoming/v3.9.17/inspection
          if ! git diff --cached --quiet; then
            git commit -m 'Stage Manager UI performance investigation sources [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
