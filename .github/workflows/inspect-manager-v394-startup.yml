name: Inspect Manager V3.9.4 Startup

on:
  push:
    branches:
      - feature/manager-v3.9.4-startup-diagnostics
    paths:
      - .github/workflows/inspect-manager-v394-startup.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.4-startup-diagnostics

      - name: Inspect V3.9.3 startup source
        shell: python
        run: |
          import re, zipfile
          from pathlib import Path

          pkg = Path('manager/packages/FreeCam_Manager_V3.9.3_Source.zip')
          patterns = [
              'OnStartup', 'StartupUri', 'MainWindow', 'InitializeComponent',
              'Refresh', 'Scan', 'Load', 'SQLite', 'Database', 'Index',
              'GitHub', 'Update', 'Dispatcher', 'Show', 'ContentRendered',
              'Loaded', 'Task.Run', 'await ', 'GetAwaiter', '.Result', '.Wait('
          ]
          with zipfile.ZipFile(pkg) as zf:
              names = zf.namelist()
              candidates = [n for n in names if n.endswith(('.cs','.xaml')) and (
                  n.endswith('App.xaml') or n.endswith('App.xaml.cs') or
                  'MainWindow' in n or 'Shell' in n or 'MainViewModel' in n or
                  'HomeViewModel' in n or 'ArtifactOrganizer' in n or
                  'Index' in n or 'Database' in n or 'Update' in n
              )]
              out = []
              out.append('===== CANDIDATES =====')
              out.extend(candidates)
              for name in candidates:
                  try:
                      text = zf.read(name).decode('utf-8-sig')
                  except Exception:
                      continue
                  lines = text.splitlines()
                  hits = []
                  for i,line in enumerate(lines):
                      if any(p.lower() in line.lower() for p in patterns):
                          hits.append(i)
                  if not hits and not (name.endswith('App.xaml.cs') or 'MainWindow' in name):
                      continue
                  out.append('\n===== ' + name + ' =====')
                  seen=set()
                  if name.endswith('App.xaml.cs') or name.endswith('App.xaml') or 'MainWindow' in name:
                      ranges=[(0, min(len(lines), 260))]
                  else:
                      ranges=[]
                      for i in hits[:40]:
                          ranges.append((max(0,i-3), min(len(lines),i+5)))
                  for a,b in ranges:
                      for n in range(a,b):
                          if n not in seen:
                              out.append(f'{n+1:05d}: {lines[n]}')
                              seen.add(n)
                      out.append('')
          target = Path('manager/incoming/v3.9.4/startup_snapshot.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(out), encoding='utf-8')

      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.4/startup_snapshot.txt
          git commit -m "chore: capture V3.9.3 startup chain" || exit 0
          git push
