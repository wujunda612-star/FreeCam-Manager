name: Build Manager V3.7 Candidate

on:
  push:
    branches:
      - feature/manager-v3.7
    paths:
      - '.github/workflows/build-manager-v37.yml'
      - '.github/scripts/build_manager_v37.py'
      - '.github/scripts/stage_manager_v37.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract V3.6 base
        shell: bash
        run: |
          rm -rf /tmp/v37
          mkdir -p /tmp/v37
          unzip -q manager/packages/FreeCam_Manager_V3.6_Source.zip -d /tmp/v37

      - name: Add V3.7 tests first
        shell: bash
        run: python .github/scripts/build_manager_v37.py add-tests --source-root /tmp/v37

      - name: RED - prove V3.7 regressions fail on untouched V3.6 production source
        shell: bash
        run: |
          cd /tmp/v37/src-wpf
          dotnet restore FreeCamManager.Tests/FreeCamManager.Tests.csproj
          dotnet build FreeCamManager.Tests/FreeCamManager.Tests.csproj -c Release --no-restore -v:minimal
          set +e
          dotnet FreeCamManager.Tests/bin/Release/net8.0/FreeCamManager.Tests.dll > /tmp/v37-red-tests.txt 2>&1
          test_rc=$?
          python validate-v37.py > /tmp/v37-red-validator.txt 2>&1
          validator_rc=$?
          set -e
          cat /tmp/v37-red-tests.txt
          cat /tmp/v37-red-validator.txt
          test "$test_rc" -ne 0
          test "$validator_rc" -ne 0
          grep -q 'FAIL V3.7 matched Result ZIP beats raw log' /tmp/v37-red-tests.txt
          grep -q 'FAIL V3.7 tested raw log upgrades when Result ZIP appears' /tmp/v37-red-tests.txt
          grep -q 'FAIL V3.7 tested status click opens Result location without breaking drag' /tmp/v37-red-tests.txt
          grep -q 'matched 40_Result ZIP must be resolved before current raw log' /tmp/v37-red-validator.txt
          grep -q 'tested status badge click handler is missing' /tmp/v37-red-validator.txt
          echo 'RED verified.'

      - name: Apply minimal V3.7 production changes
        shell: bash
        run: python .github/scripts/build_manager_v37.py apply-production --source-root /tmp/v37

      - name: GREEN - validators and compatibility tests
        shell: bash
        run: |
          cd /tmp/v37/src-wpf
          python validate-v34-fix7-updater.py
          python validate-v35.py
          python validate-v36.py
          python validate-v37.py
          dotnet build FreeCamManager.Tests/FreeCamManager.Tests.csproj -c Release -v:minimal
          dotnet FreeCamManager.Tests/bin/Release/net8.0/FreeCamManager.Tests.dll

      - name: Clean generated build folders
        shell: bash
        run: python .github/scripts/build_manager_v37.py clean --source-root /tmp/v37

      - name: Upload clean V3.7 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: manager-v37-source
          path: /tmp/v37/
          include-hidden-files: true
          retention-days: 1

  windows-build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manager-v37-source
          path: source

      - name: Real Windows WPF build and publish
        shell: powershell
        run: |
          Set-Location source\src-wpf
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build_v3_On_Windows.ps1 -OutDir BuildOutput -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content .\BuildOutput\BUILD_RESULT.txt
          if (-not (Test-Path .\BuildOutput\FreeCam_Manager.exe)) { throw 'FreeCam_Manager.exe was not produced' }
          $exe = Get-Item .\BuildOutput\FreeCam_Manager.exe
          $sha = (Get-FileHash .\BuildOutput\FreeCam_Manager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "WINDOWS_WPF_PUBLISH_OK size=$($exe.Length) sha256=$sha"

  stage-candidate:
    needs: [prepare, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.7
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: manager-v37-source
          path: /tmp/v37

      - name: Generate verified V3.7 patch and publish metadata
        shell: bash
        run: python .github/scripts/stage_manager_v37.py --source-root /tmp/v37 --repo-root .

      - name: Commit candidate patch metadata to feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager/incoming/v3.7.0/v36-to-v37.patch.gz.b85 manager/publish-v37.candidate.json
          git commit -m 'build: stage Manager V3.7 candidate [skip ci]'
          git pull --rebase origin feature/manager-v3.7
          git push origin HEAD:feature/manager-v3.7
