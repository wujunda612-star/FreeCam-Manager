name: Validate Manager V3.9.3 TDD

on:
  push:
    branches:
      - feature/manager-v3.9.3-ui-polish
    paths:
      - .github/workflows/validate-manager-v393-tdd.yml
      - manager/incoming/v3.9.3/test_v393_contract.py
      - manager/incoming/v3.9.3/apply_v393.py

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V3.9.3 candidate from V3.9.2 baseline
        shell: python
        run: |
          import zipfile, shutil
          from pathlib import Path
          src = Path('manager/packages/FreeCam_Manager_V3.9.2_Source.zip')
          root = Path('manager/incoming/v3.9.3/_candidate')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          with zipfile.ZipFile(src) as zf: zf.extractall(root)
      - name: Apply V3.9.3 patch
        run: python manager/incoming/v3.9.3/apply_v393.py manager/incoming/v3.9.3/_candidate
      - name: Pack V3.9.3 candidate
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          root = Path('manager/incoming/v3.9.3/_candidate')
          out = Path('manager/incoming/v3.9.3/FreeCam_Manager_V3.9.3_Source.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): zf.write(p, p.relative_to(root).as_posix())
      - name: Run V3.9.3 contract (GREEN)
        run: python manager/incoming/v3.9.3/test_v393_contract.py manager/incoming/v3.9.3/FreeCam_Manager_V3.9.3_Source.zip
