name: Prepare FreeCam Manager V3.9.12

on:
  push:
    paths:
      - 'manager/incoming/v3.9.12/trigger.json'

permissions:
  contents: write

concurrency:
  group: manager-v3.9.12-prepare
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated V3.9.12 local builder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $partsDir = Join-Path $env:GITHUB_WORKSPACE 'manager\incoming\v3.9.12\builder-parts'
          $parts = Get-ChildItem -LiteralPath $partsDir -Filter 'part*.txt' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 builder parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'FreeCam_Manager_V3.9.12_Local1.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expected = 'd668cbe0c4b3669f687ee4ca7cf0e0d7602143a7a9d13145c1f97687dc6408da'
          if ($actual -ne $expected) { throw "V3.9.12 builder SHA mismatch: expected=$expected actual=$actual" }

          $dst = Join-Path $env:RUNNER_TEMP 'manager-v3912-builder'
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
          $script = Get-ChildItem -Path $dst -Filter 'Build_V3.9.12_Local1.ps1' -File -Recurse | Select-Object -First 1
          if ($null -eq $script) { throw 'Build_V3.9.12_Local1.ps1 not found after reconstruction' }

          $base = Join-Path $env:GITHUB_WORKSPACE 'manager\packages\FreeCam_Manager_V3.9.8_Source.zip'
          if (-not (Test-Path -LiteralPath $base)) { throw 'Official V3.9.8 source package missing' }
          Copy-Item -Force -LiteralPath $base -Destination (Join-Path $script.Directory.FullName 'FreeCam_Manager_V3.9.8_Source.zip')

          "BUILDER_DIR=$($script.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILDER_SCRIPT=$($script.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exactly the locally validated V3.9.12 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:BUILDER_SCRIPT -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "V3.9.12 local builder failed: $LASTEXITCODE" }
          $sourceRoot = Join-Path $env:BUILDER_DIR '_work\source'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'src-wpf\FreeCamManager\FreeCamManager.csproj'))) {
            $candidate = Get-ChildItem -LiteralPath $sourceRoot -Directory -Recurse | Where-Object {
              Test-Path -LiteralPath (Join-Path $_.FullName 'src-wpf\FreeCamManager\FreeCamManager.csproj')
            } | Select-Object -First 1
            if ($null -eq $candidate) { throw 'Patched V3.9.12 source root not found' }
            $sourceRoot = $candidate.FullName
          }
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Convert local validation tree to release tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SOURCE_ROOT 'src-wpf'
          $program = Join-Path $src 'FreeCamManager.Tests\Program.cs'
          $t = [IO.File]::ReadAllText($program)

          $nl = if ($t.Contains("`r`n")) { "`r`n" } else { "`n" }

          $old1 = @(
            '        Assert(app.Contains("LibraryRebuildService", StringComparison.Ordinal)'
            '            && app.Contains("ReconcileAsync(settings.RootDir", StringComparison.Ordinal),'
            '            "startup must reconcile already-classified files from the configured FreeCam root");'
            '        Assert(watcher.Contains("manual && _rebuild is not null", StringComparison.Ordinal)'
            '            && watcher.Contains("_rebuild.ReconcileAsync(cfg.RootDir", StringComparison.Ordinal),'
            '            "manual Refresh must reconcile the managed root as well as scan the inbox");'
          ) -join $nl
          $new1 = @(
            '        Assert(app.Contains("LIBRARY_REBUILD_STARTUP_DEFERRED", StringComparison.Ordinal)'
            '            && !app.Contains("await libraryRebuild.ReconcileAsync(settings.RootDir, ct)", StringComparison.Ordinal),'
            '            "startup must defer the expensive full-library rebuild");'
            '        Assert(!watcher.Contains("_rebuild.ReconcileAsync(cfg.RootDir", StringComparison.Ordinal)'
            '            && watcher.Contains("RefreshActiveAsync", StringComparison.Ordinal),'
            '            "manual inbox reorganization must remain inbox-only while automatic scan refreshes active tests");'
          ) -join $nl
          if (-not $t.Contains($old1)) { throw 'V371 recovery contract anchor missing' }
          $t = $t.Replace($old1, $new1)

          $old2 = @(
            '        Assert(source.Contains("RunStartupMaintenanceAsync(", StringComparison.Ordinal)'
            '            && source.Contains("libraryRebuild.ReconcileAsync(settings.RootDir, ct)", StringComparison.Ordinal)'
            '            && source.Contains("BACKGROUND_MAINTENANCE_DONE", StringComparison.Ordinal),'
            '            "background repair must still reconcile the library and record completion");'
          ) -join $nl
          $new2 = @(
            '        Assert(source.Contains("RunStartupMaintenanceAsync(", StringComparison.Ordinal)'
            '            && source.Contains("LIBRARY_REBUILD_STARTUP_DEFERRED", StringComparison.Ordinal)'
            '            && source.Contains("BACKGROUND_MAINTENANCE_DONE", StringComparison.Ordinal),'
            '            "background maintenance must defer full rebuild and still record completion");'
          ) -join $nl
          if (-not $t.Contains($old2)) { throw 'V396 startup contract anchor missing' }
          $t = $t.Replace($old2, $new2)

          $old3 = @(
            '        Assert(editor.Contains("ResetClassificationRulesCommand") && editor.Contains("MoveDragUpCommand")'
            '            && editor.Contains("PreviewClassificationCommand"), "restore, precedence and preview controls missing");'
          ) -join $nl
          $new3 = @(
            '        Assert(editor.Contains("ResetClassificationRulesCommand") && editor.Contains("MoveDragUpCommand")'
            '            && !editor.Contains("PreviewClassificationCommand"), "restore/precedence controls missing or removed preview returned");'
          ) -join $nl
          if (-not $t.Contains($old3)) { throw 'V398 rule-editor contract anchor missing' }
          $t = $t.Replace($old3, $new3)

          $refreshOld = 'devVm.Contains("正在扫描收件箱", StringComparison.Ordinal)'
          $refreshNew = 'devVm.Contains("正在重新整理收件箱", StringComparison.Ordinal)'
          if ($t.Contains($refreshOld)) { $t = $t.Replace($refreshOld, $refreshNew) }
          $t = $t.Replace($refreshOld, $refreshNew)
          $t = $t.Replace('"development refresh must trigger real inbox scan"', '"development manual action must trigger inbox reorganization"')
          [IO.File]::WriteAllText($program, $t, (New-Object System.Text.UTF8Encoding($true)))

          $classificationPath = Join-Path $src 'FreeCamManager.Core\Services\ClassificationService.cs'
          $classificationText = [IO.File]::ReadAllText($classificationPath)
          $featureOld = '"FeatureLike" => !IsExperimentStage(a.Stage) && ('
          $featureNew = '"FeatureLike" => ('
          if (-not $classificationText.Contains($featureOld)) { throw 'FeatureLike compatibility anchor missing' }
          $classificationText = $classificationText.Replace($featureOld, $featureNew)
          [IO.File]::WriteAllText($classificationPath, $classificationText, (New-Object System.Text.UTF8Encoding($true)))

          foreach ($manifest in @((Join-Path $env:SOURCE_ROOT 'BUILD_MANIFEST.json'), (Join-Path $src 'BUILD_MANIFEST.json'))) {
            if (-not (Test-Path -LiteralPath $manifest)) { continue }
            $m = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json
            if ($m.PSObject.Properties['Version']) { $m.Version = 'V3.9.12' }
            if ($m.PSObject.Properties['BuildName']) { $m.BuildName = 'FreeCam_Manager_V3.9.12' }
            if ($m.PSObject.Properties['Base']) { $m.Base = 'FreeCam_Manager_V3.9.8' }
            if ($m.PSObject.Properties['Branch']) { $m.Branch = 'release/manager-v3.9.12' }
            if ($m.PSObject.Properties['Feature']) { $m.Feature = 'Stable persistence + targeted test refresh + inbox-only reorganize + fast path rebase + Regression classification' }
            if ($m.PSObject.Properties['BuildType']) { $m.BuildType = 'Stable' }
            if ($m.PSObject.Properties['Stage']) { $m.Stage = 'Release' }
            if ($m.PSObject.Properties['BuildId']) { $m.BuildId = 'MANAGER-V3912-20261005' }
            if ($m.PSObject.Properties['Commit']) { $m.Commit = 'PUBLISH-WORKFLOW' }
            if ($m.PSObject.Properties['ReleaseState']) { $m.ReleaseState = 'Stable' }
            if ($m.PSObject.Properties['RemotePublish']) { $m.RemotePublish = $true }
            $m | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $manifest -Encoding UTF8
          }

          $watch = Get-Content -Raw -LiteralPath (Join-Path $src 'FreeCamManager.Core\Services\InboxWatcherService.cs')
          $rebase = Get-Content -Raw -LiteralPath (Join-Path $src 'FreeCamManager.Core\Services\PathRebaseService.cs')
          $manifestService = Get-Content -Raw -LiteralPath (Join-Path $src 'FreeCamManager.Core\Services\ManifestService.cs')
          $stableVm = Get-Content -Raw -LiteralPath (Join-Path $src 'FreeCamManager\ViewModels\StableViewModel.cs')
          if ($watch -match '_rebuild\.ReconcileAsync\(cfg\.RootDir' -or $watch -notmatch 'RefreshActiveAsync') { throw 'Inbox-only reorganize contract missing' }
          if ($rebase -notmatch 'BuildUniqueFileIndex') { throw 'Fast PathRebase contract missing' }
          if ($manifestService -notmatch 'Regression\|Reg') { throw 'Regression/Reg parser contract missing' }
          if ($stableVm -notmatch 'HasFrozenMarker' -or $stableVm -notmatch 'Task\.Run') { throw 'Stable persistence/background contract missing' }

      - name: Clean source tree and create source package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SOURCE_ROOT 'src-wpf'
          Get-ChildItem -LiteralPath $src -Directory -Recurse -Force |
            Where-Object { $_.Name -in @('bin','obj','BuildOutput','BuildOutput_ReleaseGate','.tools') } |
            Sort-Object { $_.FullName.Length } -Descending |
            ForEach-Object { Remove-Item -Recurse -Force -LiteralPath $_.FullName -ErrorAction SilentlyContinue }

          $package = Join-Path $env:GITHUB_WORKSPACE 'manager\packages\FreeCam_Manager_V3.9.12_Source.zip'
          Remove-Item -Force -ErrorAction SilentlyContinue $package
          Compress-Archive -Path (Join-Path $env:SOURCE_ROOT '*') -DestinationPath $package -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          "PACKAGE_PATH=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "V3.9.12 source SHA256=$sha"

      - name: Final Windows release gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'manager\release\Validate_Manager_Source_Package.ps1') -PackagePath $env:PACKAGE_PATH -ExpectedSha256 $env:PACKAGE_SHA -ExpectedVersion '3.9.12'
          if ($LASTEXITCODE -ne 0) { throw "Final V3.9.12 release gate failed: $LASTEXITCODE" }

      - name: Publish V3.9.12 source package request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $publishPath = Join-Path $env:GITHUB_WORKSPACE 'manager\publish.json'
          $publish = [ordered]@{
            schemaVersion = 1
            version = '3.9.12'
            displayVersion = 'V3.9.12'
            packageName = 'FreeCam_Manager_V3.9.12_Source.zip'
            sourceSha256 = $env:PACKAGE_SHA
            notes = 'V3.9.12：Stable 冻结状态持久化并后台执行冻结/备份；测试完成使用活动测试定向刷新自动更新为“已测试”；“重新整理收件箱”仅处理 Inbox，不再触发全库重建；PathRebase 改为快速路径与一次性文件索引，启动维护由分钟级降至毫秒级；补齐 Reg/Regression 开发包识别与分类，并保留 RC/source-full、根 Manifest 优先、自定义规则中文化/深色模式等修复。'
            publishRevision = 12
          }
          $publish | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $publishPath -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'manager/packages/FreeCam_Manager_V3.9.12_Source.zip' 'manager/publish.json'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Nothing staged for V3.9.12 publish' }
          git commit -m 'Publish FreeCam Manager V3.9.12 source package'
          git push origin HEAD:main
