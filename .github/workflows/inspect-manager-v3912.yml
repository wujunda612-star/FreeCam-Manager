name: Inspect FreeCam Manager V3.9.12 Staging

on:
  push:
    paths:
      - 'manager/incoming/v3.9.12/inspect-trigger.json'

permissions:
  contents: write

concurrency:
  group: manager-v3.9.12-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and inspect verified Local1 package
        id: inspect
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:GITHUB_WORKSPACE 'manager\incoming\v3.9.12\inspect-result.txt'
          $lines = New-Object System.Collections.Generic.List[string]
          try {
            $partsDir = Join-Path $env:GITHUB_WORKSPACE 'manager\incoming\v3.9.12\builder-parts'
            $parts = Get-ChildItem -LiteralPath $partsDir -Filter 'part*.txt' | Sort-Object Name
            if ($parts.Count -ne 8) { throw "Expected 8 parts, found $($parts.Count)" }
            foreach ($part in $parts) {
              $text = (Get-Content -Raw -LiteralPath $part.FullName).Trim()
              $lines.Add(("PART {0} len={1}" -f $part.Name, $text.Length))
            }
            $b64 = ($parts | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() }) -join ''
            $zip = Join-Path $env:RUNNER_TEMP 'FreeCam_Manager_V3.9.12_Local1.zip'
            [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
            $expected = 'd668cbe0c4b3669f687ee4ca7cf0e0d7602143a7a9d13145c1f97687dc6408da'
            $lines.Add("ZIP_BYTES=$((Get-Item -LiteralPath $zip).Length)")
            $lines.Add("ZIP_SHA256=$actual")
            if ($actual -ne $expected) { throw "Local1 SHA mismatch: expected=$expected actual=$actual" }

            $dst = Join-Path $env:RUNNER_TEMP 'manager-v3912-local1'
            if (Test-Path -LiteralPath $dst) { Remove-Item -Recurse -Force -LiteralPath $dst }
            Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
            $lines.Add('SHA_MATCH=TRUE')
            $lines.Add('--- FILE TREE ---')
            Get-ChildItem -LiteralPath $dst -File -Recurse | Sort-Object FullName | ForEach-Object {
              $rel = $_.FullName.Substring($dst.Length).TrimStart('\')
              $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              $lines.Add(("{0} | bytes={1} | sha256={2}" -f $rel, $_.Length, $sha))
            }

            $lines.Add('--- TEXT FILE CONTENTS ---')
            Get-ChildItem -LiteralPath $dst -File -Recurse | Where-Object {
              $_.Extension -in @('.ps1','.json','.txt','.md','.csproj')
            } | Sort-Object FullName | ForEach-Object {
              $rel = $_.FullName.Substring($dst.Length).TrimStart('\')
              $lines.Add("===== BEGIN $rel =====")
              $lines.Add((Get-Content -Raw -LiteralPath $_.FullName))
              $lines.Add("===== END $rel =====")
            }
            $lines.Add('INSPECT_STATUS=PASS')
          }
          catch {
            $lines.Add("INSPECT_STATUS=FAIL")
            $lines.Add("ERROR=$($_.Exception.Message)")
          }
          [IO.File]::WriteAllLines($report, $lines, (New-Object System.Text.UTF8Encoding($false)))

      - name: Commit inspection report
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'manager/incoming/v3.9.12/inspect-result.txt'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Inspect FreeCam Manager V3.9.12 staging [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          }
