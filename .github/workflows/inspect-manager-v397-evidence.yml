name: Inspect Manager Result Evidence Selection V3.9.7

on:
  push:
    branches:
      - feature/manager-v3.9.7-resultzip-priority
    paths:
      - .github/workflows/inspect-manager-v397-evidence.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manager-v3.9.7-resultzip-priority
      - name: Extract all relevant evidence and drag source
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          zf = zipfile.ZipFile("manager/packages/FreeCam_Manager_V3.9.6_Source.zip")
          targets = [
              "TestResultService.cs",
              "TestStatusRefreshService.cs",
              "DevelopmentViewModel.cs",
              "HistoryViewModel.cs",
              "ArtifactRowViewModel.cs",
              "LibraryRebuildService.cs",
              "InboxWatcherService.cs",
              "LibraryService.cs",
              "App.xaml.cs",
              "Program.cs",
              "MainWindowViewModel.cs",
              "ManifestService.cs",
              "ClassificationService.cs",
              "DevelopmentView.xaml.cs",
              "HistoryView.xaml.cs"
          ]
          for name in zf.namelist():
              if Path(name).name not in targets: continue
              path = Path("manager/incoming/v3.9.7/inspection") / name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(zf.read(name))
              print(name)
      - name: Commit inspection source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/incoming/v3.9.7/inspection
          git commit -m "chore: inspect V3.9.6 evidence resolution and drag" || exit 0
          git push
